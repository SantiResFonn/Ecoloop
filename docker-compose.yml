services:

  # ─── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ecoloop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecoloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoloop_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ecoloop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Opcional: carga el esquema inicial al primer arranque
      # - ./EcoLoop_Backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecoloop} -d ${POSTGRES_DB:-ecoloop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecoloop_net

  # ─── Backend (NestJS / Express + Prisma) ─────────────────────
  backend:
    build:
      context: ./EcoLoop_Backend
      dockerfile: Dockerfile
    container_name: ecoloop_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecoloop}:${POSTGRES_PASSWORD:-ecoloop_secret}@db:5432/${POSTGRES_DB:-ecoloop}
      DIRECT_URL: postgresql://${POSTGRES_USER:-ecoloop}:${POSTGRES_PASSWORD:-ecoloop_secret}@db:5432/${POSTGRES_DB:-ecoloop}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-changeme_super_secret}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    networks:
      - ecoloop_net

  # ─── Frontend (Next.js) ──────────────────────────────────────
  frontend:
    build:
      context: ./EcoLoop_Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: ecoloop_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - ecoloop_net

volumes:
  postgres_data:

networks:
  ecoloop_net:
    driver: bridge
