apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecoloop-frontend
  namespace: ecoloop
  labels:
    app: ecoloop-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecoloop-frontend
  template:
    metadata:
      labels:
        app: ecoloop-frontend
    spec:
      containers:
        - name: frontend
          image: santiagorestrefon/ecoloop-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "http://ecoloop-backend:3001"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
